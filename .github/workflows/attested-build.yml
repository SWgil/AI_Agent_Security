# Trusted builder for the provenance PoC.
#
# This reusable workflow stands in for a builder owned by the attestation
# issuer. A repository calls it instead of writing its own build steps, and
# the issuer only attests builds whose OIDC token names this workflow
# (job_workflow_ref), so the caller cannot swap in a different APK.
#
# In this PoC the workflow lives in the same repository as the app, so the
# repository owner can still edit it. A real issuer would host it in a
# repository the app developer cannot write to.
name: Attested build (trusted builder)

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signer dependencies
        run: pip install --quiet pyjwt cryptography pytest

      - name: Test the signer
        run: python -m pytest -q poc/signer/tests

      - name: Test the builder tools
        run: python -m pytest -q poc/builder/tests

      # The app's build scripts are code written by the app developer. They run
      # as a separate user that has no token, cannot write to this checkout,
      # and can reach the network only through the recording proxy.
      - name: Set up an isolated build user
        run: |
          sudo useradd --create-home builder
          for cmd in iptables ip6tables; do
            sudo $cmd -A OUTPUT -m owner --uid-owner builder -o lo -j ACCEPT
            sudo $cmd -A OUTPUT -m owner --uid-owner builder -j REJECT
          done
          sudo cp -r poc/android /home/builder/src
          sudo chown -R builder: /home/builder/src

      # The builder supplies Gradle itself: the official distribution of the
      # version the project asks for. The wrapper jar and download URL in the
      # repository are not used, since both are under the developer's control.
      - name: Provide the Gradle distribution
        run: |
          version=$(sed -nE 's#^distributionUrl=https\\://services\.gradle\.org/distributions/gradle-([0-9]+(\.[0-9]+){1,2})-bin\.zip$#\1#p' \
            poc/android/gradle/wrapper/gradle-wrapper.properties)
          [ -n "$version" ] || { echo "distributionUrl is not an official Gradle release"; exit 1; }
          zip="$RUNNER_TEMP/gradle-$version-bin.zip"
          curl -fsSL -o "$zip" "https://services.gradle.org/distributions/gradle-$version-bin.zip"
          echo "$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256")  $zip" | sha256sum -c -
          sudo unzip -q "$zip" -d /opt/builder-gradle
          echo "GRADLE_ZIP=$zip" >> "$GITHUB_ENV"
          echo "GRADLE_BIN=/opt/builder-gradle/gradle-$version/bin/gradle" >> "$GITHUB_ENV"

      - name: Start the recording proxy
        run: |
          nohup python poc/builder/record_proxy.py --port 3128 --log "$RUNNER_TEMP/hosts.log" \
            > "$RUNNER_TEMP/proxy.out" 2>&1 &
          for i in $(seq 50); do
            (exec 3<>/dev/tcp/127.0.0.1/3128) 2>/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/proxy.out"; exit 1

      - name: Check that the build user cannot bypass the proxy
        run: |
          if sudo -u builder curl -sS -m 10 -o /dev/null https://example.com; then
            echo "direct connection succeeded: isolation is not working"; exit 1
          fi
          sudo -u builder curl -fsS -m 20 -o /dev/null -x http://127.0.0.1:3128 https://example.com
          grep " example.com:443$" "$RUNNER_TEMP/hosts.log"
          : > "$RUNNER_TEMP/hosts.log"

      - name: Build the APKs as the isolated user
        run: |
          set -o pipefail
          proxy="-Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=3128 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=3128"
          sudo -u builder env -i HOME=/home/builder PATH="$JAVA_HOME/bin:/usr/bin:/bin" \
            JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" JAVA_TOOL_OPTIONS="$proxy" \
            GRADLE_BIN="$GRADLE_BIN" \
            bash -c 'cd /home/builder/src && "$GRADLE_BIN" --no-daemon --info --console=plain :sample:assembleRelease :verifier:assembleRelease' 2>&1 \
            | python -u -c 'import sys, time
          for line in sys.stdin:
              sys.stdout.write(time.strftime("%H:%M:%S ", time.gmtime()) + line)' > "$RUNNER_TEMP/build.log" \
            || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/build.log"

      - name: Collect what the build downloaded
        run: |
          mkdir -p dist
          sudo python poc/builder/collect_inputs.py --gradle-home /home/builder/.gradle \
            --hosts-log "$RUNNER_TEMP/hosts.log" --toolchain "$GRADLE_ZIP" --out "$RUNNER_TEMP/inputs.json"
          cp "$RUNNER_TEMP/inputs.json" dist/build-inputs.json
          cp "$RUNNER_TEMP/build.log" dist/build.log
          cp "$RUNNER_TEMP/hosts.log" dist/network.log

      - name: Attest the APKs
        run: |
          for module in sample verifier; do
            sudo cat "/home/builder/src/$module/build/outputs/apk/release/$module-release.apk" > "$RUNNER_TEMP/$module.apk"
            python poc/signer/attest.py "$RUNNER_TEMP/$module.apk" \
              --out "dist/$module-attested.apk" \
              --inputs "$RUNNER_TEMP/inputs.json" \
              --trusted-workflow-prefix "${{ github.repository }}/.github/workflows/attested-build.yml@"
          done

      - name: Check that Android still accepts the APK signatures
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$apksigner" verify --verbose "$apk" | grep "v2 scheme.*: true"
          done

      - name: Verify the attestations (Python and Kotlin)
        run: |
          for apk in dist/*.apk; do python poc/signer/verify.py "$apk" | head -1; done
          cd poc/android
          ./gradlew --no-daemon :provenance-core:test -PattestedApk="$GITHUB_WORKSPACE/dist/sample-attested.apk"

      - name: Check the lookups by id that the verifier app relies on
        run: |
          curl -fsS "https://api.github.com/repositories/${{ github.repository_id }}" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d['full_name'], d['created_at'], d['fork'], d['owner']['id'])"
          curl -fsS "https://api.github.com/user/${{ github.repository_owner_id }}" \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d['login'], d['created_at'])"

      - uses: actions/upload-artifact@v4
        with:
          name: attested-apks
          path: dist/
